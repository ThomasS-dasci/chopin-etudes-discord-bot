name: Check YouTube Uploads

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check YouTube uploads
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_UPLOAD_CHANNEL_ID: ${{ secrets.YOUTUBE_UPLOAD_CHANNEL_ID }}
          UPLOAD_NOTIFICATION_ROLE_ID: ${{ secrets.UPLOAD_NOTIFICATION_ROLE_ID }}
        run: python youtube_upload.py

      - name: Save upload state
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "The Conductor"
          git config user.email "actions@github.com"

          git add youtube_state.json
          git commit -m "Update YouTube upload state"
          git push